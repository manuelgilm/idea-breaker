name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app links the platform webview via CGO, so it must be built
  # natively per OS (TECHNICAL_SPECIFICATION.md §10). Each matrix entry builds
  # the host-arch binary and packages it; publish-desktop attaches the results
  # to the release created by the goreleaser job.
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
          - os: macos-14
            goos: darwin
            arch: universal
          - os: windows-latest
            goos: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        working-directory: cmd/aibreak-desktop
        run: wails build -tags "webkit2_41"

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        working-directory: cmd/aibreak-desktop
        run: wails build -platform darwin/universal

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        working-directory: cmd/aibreak-desktop
        run: wails build

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: cmd/aibreak-desktop/build/bin
        run: tar -czf "aibreak-desktop-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.arch }}.tar.gz" aibreak-desktop

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: cmd/aibreak-desktop/build/bin
        run: zip -r "aibreak-desktop-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.arch }}.zip" aibreak-desktop.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: cmd/aibreak-desktop/build/bin
        run: Compress-Archive -Path aibreak-desktop.exe -DestinationPath "aibreak-desktop-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.arch }}
          path: cmd/aibreak-desktop/build/bin/aibreak-desktop-*
          if-no-files-found: error

  publish-desktop:
    needs: [goreleaser, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
